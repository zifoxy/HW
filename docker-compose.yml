services:
  db:
    image: postgres:16-alpine
    container_name: hw_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_DOCKER:-homework}
      POSTGRES_USER: ${PASTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DOCKER:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRESQL_PORT_DOCKER:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PASTGRESQL_USER:-postgres} -d ${POSTGRES_DATABASE_DOCKER:-homework}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: hw_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PASTGRESQL_USER: ${PASTGRESQL_USER:-postgres}
      POSTGRES_DATABASE_DOCKER: ${POSTGRES_DATABASE_DOCKER:-homework}
      POSTGRES_PASSWORD_DOCKER: ${POSTGRES_PASSWORD_DOCKER:-postgres}
      POSTGRESQL_PORT_DOCKER: 5432
      POSTGRESQL_HOST_DOCKER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
